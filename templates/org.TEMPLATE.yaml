# Context Fabric Org document, contract 1
#
# What one organization publishes about the systems it owns: what each system
# is, how to reach it, what it will not do, and who answers for it. The contract
# is the authority on what an Org document contains; prose describing it
# elsewhere is commentary.
#
# Generated by scripts/render-templates.sh from schemas/org/1/schema.json. Do
# not edit this file by hand: edit the contract and render again.
# `scripts/render-templates.sh --check` fails until the two agree, so a key the
# contract gains cannot go missing here.
#
# Every value below is an example to replace. `(required)` marks a key the
# contract demands; `(optional)` marks one it allows, and you may delete the key
# along with its comment. A list shows one entry; add as many as the facts need.
# An empty list is a claim that somebody looked and found none, which is why a
# required list is not the same as an absent one.

# id (required) -- This document's identifier, stable across every move and
# rename. It is what a Bounded Context references, so changing it breaks
# references that changing a filename would not.
id: example-identifier
# kind (required) -- Which contract this document is written against. It is what
# tells a reader which tier to check it under, so a near miss is a document
# nothing can classify.
kind: org
# schema_version (required) -- The contract version this document is written
# against.
schema_version: 1
# release (required) -- This document's release number. A Bounded Context
# records the release it read, so this is what makes a stale reference visible
# instead of silent.
release: 1
# organization (required) -- The organization whose systems this document
# describes.
# The organization whose facts this document carries. Nesting is a parent
# reference only; children are derived when views are generated.
organization:
  # id (required) -- The organization's identifier.
  id: example-identifier
  # name (required) -- What the organization calls itself.
  name: Replace this with one line of prose.
  # parent (optional) -- The identifier of the organization this one sits
  # inside, when it sits inside one.
  parent: example-identifier
  # maintainer (optional) -- Who answers for this organization's entry.
  # Who answers for a fact: either an alias standing for a team or role, or the
  # id of an Individual document. Exactly one of the two, because a fact with
  # two owners has none.
  maintainer:
    # alias (optional) -- A team or role alias. Never a person's name: this
    # document is shared and may be public.
    alias: example-identifier
    # the contract allows alias or individual, never both, so this one is
    # commented out; swap them if it is the one you mean.
    # individual (optional) -- The id of an Individual document.
    # individual: example-identifier
# maintainer (optional) -- Who answers for this document as a whole, when that
# differs from the organization's own maintainer.
# Who answers for a fact: either an alias standing for a team or role, or the id
# of an Individual document. Exactly one of the two, because a fact with two
# owners has none.
maintainer:
  # alias (optional) -- A team or role alias. Never a person's name: this
  # document is shared and may be public.
  alias: example-identifier
  # the contract allows alias or individual, never both, so this one is
  # commented out; swap them if it is the one you mean.
  # individual (optional) -- The id of an Individual document.
  # individual: example-identifier
# secret_storage (optional) -- Where this organization's practitioners keep the
# credentials its systems need. It names the store and how to get access to it,
# never a reference into it and never a value.
secret_storage:
    # id (required) -- The store's identifier.
  - id: example-identifier
    # name (required) -- What practitioners call the store.
    name: Replace this with one line of prose.
    # guidance (optional) -- How someone who needs access gets it.
    guidance: Replace this with one line of prose.
# systems (required) -- The systems this organization owns. A system nobody here
# owns belongs in the organization that owns it, referenced rather than copied.
systems:
    # id (required) -- The system's identifier, which a Bounded Context
    # references as <document-id>#<system-id>.
  - id: example-identifier
    # name (required) -- What the organization calls the system.
    name: Replace this with one line of prose.
    # kind (required) -- What kind of thing the system is. The list is what the
    # framework knows how to say something useful about; something outside it is
    # better described as a limitation than mislabelled.
    kind: agent
    # status (required) -- Where the system sits in its life.
    status: active
    # previous_ids (optional) -- Identifiers this system has had before. A
    # rename stays visible here, so a reference written against the old id is
    # reported as renamed rather than missing.
    previous_ids:
      - example-identifier
    # maintainer (optional) -- Who answers for this system.
    # Who answers for a fact: either an alias standing for a team or role, or
    # the id of an Individual document. Exactly one of the two, because a fact
    # with two owners has none.
    maintainer:
      # alias (optional) -- A team or role alias. Never a person's name: this
      # document is shared and may be public.
      alias: example-identifier
      # the contract allows alias or individual, never both, so this one is
      # commented out; swap them if it is the one you mean.
      # individual (optional) -- The id of an Individual document.
      # individual: example-identifier
    # interfaces (required) -- The ways into the system. An interface nobody can
    # reach is still worth recording, with the reason in its limitations.
    interfaces:
        # id (required) -- The interface's identifier, unique within its system.
      - id: example-identifier
        # status (required) -- Where the interface sits in its life.
        status: active
        # previous_ids (optional) -- Identifiers this interface has had before.
        previous_ids:
          - example-identifier
        # type (required) -- What the interface speaks.
        type: cli
        # urls (required) -- Where the interface answers. HTTPS, or plain HTTP
        # against loopback when the interface runs on the practitioner's own
        # machine.
        urls:
          - https://api.example.invalid/v1
        # network (optional) -- Which network the interface is reachable from,
        # which is often the whole answer to why somebody cannot reach it.
        network: public
        # auth (required) -- What the interface expects at the door.
        # How a caller proves who it is, and which environment variables carry
        # the answer. The variable's purpose is recorded here; where its value
        # comes from is an Individual document's business.
        auth:
          # method (required) -- How the interface authenticates a caller.
          # host-tool means a tool already signed in on the machine -- a forge
          # CLI, a cloud SDK -- carries the credential, so the interface needs
          # no variable of its own.
          method: none
          # env (required) -- Each environment variable the interface expects,
          # and what it is for. Never a value, and never a reference to one:
          # this tier is shared.
          env:
            # each key -- The name of an environment variable, in the shape
            # every shell agrees on: upper case, digits, and underscores.
            # each value -- A line of prose written for a human reader. Never a
            # credential, never a path that resolves on one machine.
            EXAMPLE_VARIABLE: Replace this with one line of prose.
          # renamed_env (optional) -- Variables this interface used to expect
          # under another name, as previous name -> current name. It exists so a
          # practitioner who bound the previous name is told it was RENAMED
          # rather than that it is missing, and so reconciliation can re-point
          # the binding instead of leaving it for them to guess at. The current
          # name belongs in env.
          renamed_env:
            # each key -- The name of an environment variable, in the shape
            # every shell agrees on: upper case, digits, and underscores.
            # each value -- The name of an environment variable, in the shape
            # every shell agrees on: upper case, digits, and underscores.
            EXAMPLE_VARIABLE: EXAMPLE_VARIABLE
        # access_check (optional) -- A request a practitioner can make to prove
        # they have access, and what a working answer looks like.
        # The cheapest request that distinguishes having access from not having
        # it.
        access_check:
          # url (required) -- Where to send it.
          url: https://api.example.invalid/v1
          # expect (optional) -- What a working answer looks like.
          expect: Replace this with one line of prose.
        # limitations (required) -- What this interface will not do, in the
        # reader's terms. An empty list is a claim -- that somebody looked and
        # found none -- which is why the key is required and its absence is not
        # the same as an empty list.
        limitations:
          - Replace this with one line of prose.
