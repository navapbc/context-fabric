# Context Fabric Bounded Context document, contract 1
#
# The context one set of workflows needs: which organizations it draws on, which
# of their systems it actually uses, where those systems were reached from, and
# what it could not reach. It references Org facts rather than copying them, so
# an Org document's next release is the only place that fact changes.
#
# Generated by scripts/render-templates.sh from
# schemas/bounded-context/1/schema.json. Do not edit this file by hand: edit the
# contract and render again. `scripts/render-templates.sh --check` fails until
# the two agree, so a key the contract gains cannot go missing here.
#
# Every value below is an example to replace. `(required)` marks a key the
# contract demands; `(optional)` marks one it allows, and you may delete the key
# along with its comment. A list shows one entry; add as many as the facts need.
# An empty list is a claim that somebody looked and found none, which is why a
# required list is not the same as an absent one.

# id (required) -- This document's identifier, stable across every move and
# rename.
id: example-identifier
# kind (required) -- Which contract this document is written against.
kind: bounded-context
# schema_version (required) -- The contract version this document is written
# against.
schema_version: 1
# release (required) -- This document's release number.
release: 1
# identity (required) -- What this context is and who it is for.
# What this context is, said once, so every generated view can open with it.
identity:
  # name (required) -- What the team calls this context.
  name: Replace this with one line of prose.
  # purpose (required) -- What somebody can do with this context that they could
  # not do without it.
  purpose: Replace this with one line of prose.
  # audience (optional) -- Who the context is written for, when that is narrower
  # than everyone who can read it.
  audience: Replace this with one line of prose.
# organizations (required) -- The organizations this context draws on. A team
# whose work crosses an organizational boundary is the ordinary case, not an
# exception.
organizations:
  - example-identifier
# extends (required) -- The documents this context reads facts from, each with
# the release it was written against and where to read it.
extends:
    # id (required) -- The id of the referenced document.
  - id: example-identifier
    # release (required) -- The release of the referenced document this
    # reference was written against.
    release: 1
    # location (required) -- Where the referenced document can be read.
    location: file:documents/org/example-organization.yaml
# source_selection (optional) -- Which source of a fact this context uses and
# why the others were not chosen. The rejected entries are the valuable ones:
# without them the same argument is had again every quarter.
source_selection:
    # id (required) -- The identifier of the fact or feed the choice is about.
  - id: example-identifier
    # source (required) -- The source itself, named the way the team names it.
    source: Replace this with one line of prose.
    # status (required) -- Whether this source is the one to use, the one to
    # fall back to, or one that was considered and rejected.
    status: preferred
    # rationale (required) -- Why. A rejected source with no reason gets
    # proposed again next quarter.
    rationale: Replace this with one line of prose.
# repositories (optional) -- The repositories this context's workflows touch.
repositories:
    # id (required) -- The repository's identifier within this context.
  - id: example-identifier
    # location (required) -- Where it can be read.
    location: file:documents/org/example-organization.yaml
    # purpose (required) -- What this context uses it for.
    purpose: Replace this with one line of prose.
    # coverage (optional) -- How much of the repository this context works in:
    # the whole of it, or part. An agent deciding whether a file is in scope
    # branches on this, so it is a value rather than a sentence.
    coverage: whole
    # path_scope (optional) -- The paths within the repository this context
    # works in, relative to its root. Required when coverage is partial. An
    # entry names a place INSIDE the repository, so it never starts with / and
    # never climbs out with a .. segment.
    path_scope:
      - src/example/
# systems (required) -- The systems this context uses, each either referenced in
# the Org document that owns it or declared here when no document owns it yet.
systems:
    # ref (optional) -- The system in the Org document that owns it, as
    # <document-id>#<system-id>.
  - ref: "example-organization#example-system"
    # the contract allows ref or declared, never both, so this one is commented
    # out; swap them if it is the one you mean.
    # declared (optional) -- A system no published document owns yet. A stopgap,
    # and the rationale is what keeps it from becoming permanent.
    # A system this context depends on that no Org document publishes yet.
    # declared:
      # id (required) -- The system's identifier within this document.
      # id: example-identifier
      # name (required) -- What the team calls it.
      # name: Replace this with one line of prose.
      # kind (required) -- What kind of thing it is.
      # kind: agent
      # status (required) -- Where it sits in its life.
      # status: active
      # rationale (required) -- Why it is declared here instead of referenced,
      # which is also the note that makes moving it somebody's job.
      # rationale: Replace this with one line of prose.
    # scope (required) -- Whether somebody here has actually used this system.
    # `established` is a claim that a person reached it and can point at where
    # they started.
    scope: established
    # anchors (required when scope is established) -- The anchors in this
    # document that name where work on this system starts.
    anchors:
      - example-identifier
    # limitations (optional) -- What this context cannot do with this system,
    # beyond whatever the owning document already says.
    limitations:
      - Replace this with one line of prose.
# anchors (optional) -- Concrete places a workflow starts: a saved query, a
# dashboard, a folder. An anchor is what turns 'we use that system' into
# something a newcomer can open.
anchors:
    # id (required) -- The anchor's identifier within this document.
  - id: example-identifier
    # label (required) -- What a reader will see when they open it.
    label: Replace this with one line of prose.
    # location (required) -- Where it is.
    location: file:documents/org/example-organization.yaml
    # note (optional) -- What somebody needs to know before opening it.
    note: Replace this with one line of prose.
# outputs (required) -- Who the generated views are for and where they land.
# Who the generated views serve and where they are written.
outputs:
  # roles (required) -- The roles the views are written for.
  roles:
    - example-identifier
  # guidance (required) -- What a reader should do with the view, in one
  # sentence.
  guidance: Replace this with one line of prose.
  # destination (required) -- Where the generated views are written.
  destination: file:documents/org/example-organization.yaml
# limitations (required) -- What this context does not cover, in the reader's
# terms. An empty list is a claim that somebody looked.
limitations:
  - Replace this with one line of prose.
# access_failures (required) -- What this context tried to reach and could not.
# Recorded rather than dropped: an absence with no reason reads as a system
# nobody needed.
access_failures:
    # system (required) -- What was being reached, named however the team names
    # it.
  - system: Replace this with one line of prose.
    # attempt (required) -- What was tried.
    attempt: Replace this with one line of prose.
    # outcome (required) -- What happened, and what would have to change.
    outcome: Replace this with one line of prose.
