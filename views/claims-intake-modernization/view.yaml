# Generated view of claims-intake-modernization, release 1. Never hand-edited: run scripts/generate.sh.
# Every fact carries source: <document-id>@<release>. Contract: schemas/view/1/schema.json.
view_contract: 1
kind: bounded-context
id: claims-intake-modernization
release: 1
identity:
  name: Claims Intake Modernization
  purpose: What somebody needs in order to change how claims reach the agency's intake queue, without first asking four people which system owns which fact.
  audience: The engineers, analysts and product people working the intake stream across the agency and its delivery contractor.
organizations:
  - meridian-health-agency
  - harbor-line-consulting
extends:
  - id: meridian-health-agency
    location: "file:documents/examples/org/meridian-health-agency.yaml"
    release_recorded: 1
    release_current: 1
  - id: harbor-line-consulting
    location: "file:documents/examples/org/harbor-line-consulting.yaml"
    release_recorded: 1
    release_current: 1
source_selection:
  - id: intake-volume
    source: The intake counts the build pipeline publishes with each nightly run
    status: preferred
    rationale: It is derived from the same records the intake queue serves, and the delivery-tools alias stands behind it.
  - id: intake-volume-board-rollup
    source: The weekly rollup on the delivery board
    status: fallback
    rationale: It is a person's summary rather than a derived figure, so it answers when the nightly run has not completed and never contradicts it by more than a day.
  - id: intake-volume-spreadsheet
    source: A spreadsheet an analyst keeps by hand
    status: rejected
    rationale: Nobody owns it and two readers have already drawn different totals from it; recording the rejection is what stops it being proposed again next quarter.
systems:
  - ref: "meridian-health-agency#program-wiki"
    id: program-wiki
    declared: false
    source: meridian-health-agency@1
    name: Meridian Program Wiki
    kind: web-app
    status: active
    maintainer:
      alias: meridian-context-stewards
    interfaces:
      - id: web
        status: active
        type: web
        urls:
          - "https://wiki.meridian.invalid/"
        network: internal
        auth:
          method: sso
          env: {}
        limitations:
          - Page permissions are inherited from the space, so a reader who can open a space can open every draft in it.
      - id: rest
        status: active
        type: rest
        urls:
          - "https://wiki.meridian.invalid/api/v1"
        network: internal
        auth:
          method: api-key
          env:
            MERIDIAN_WIKI_TOKEN: A token scoped to the spaces the caller already reads in the web interface.
        access_check:
          url: "https://wiki.meridian.invalid/api/v1/spaces"
          expect: A 200 response listing the spaces the caller can read.
        limitations:
          - Search ranks by title far above body text, so a page whose title says nothing is reachable only by its identifier.
    scope: established
    anchors:
      - intake-runbook
    limitations:
      - Only the intake space is readable from this context's accounts, so a page linked out of it opens empty rather than missing.
  - ref: "meridian-health-agency#issue-tracker"
    id: issue-tracker
    declared: false
    source: meridian-health-agency@1
    name: Meridian Issue Tracker
    kind: web-app
    status: active
    maintainer:
      alias: meridian-delivery-tools
    interfaces:
      - id: web
        status: active
        type: web
        urls:
          - "https://tracker.meridian.invalid/"
        network: internal
        auth:
          method: sso
          env: {}
        limitations:
          - Saved filters belong to the person who saved them, so a link to one opens empty for everybody else.
      - id: rest
        status: active
        type: rest
        urls:
          - "https://tracker.meridian.invalid/api/v2"
        network: internal
        auth:
          method: api-key
          env:
            MERIDIAN_TRACKER_TOKEN: A personal token the tracker issues; it carries the caller's own permissions and no more.
        access_check:
          url: "https://tracker.meridian.invalid/api/v2/self"
          expect: A 200 response naming the calling account and the projects it can read.
        limitations:
          - The API returns at most 100 issues per page and offers no total, so a caller cannot tell a full page from the last one without asking for the next.
          - Attachments are not readable through this interface; the web interface is the only way to open one.
    scope: established
    anchors:
      - intake-board
    limitations: []
  - ref: "meridian-health-agency#docs-search"
    id: docs-search
    declared: false
    source: meridian-health-agency@1
    name: Meridian Documentation Search
    kind: mcp-server
    status: active
    previous_ids:
      - documentation-search
    maintainer:
      alias: meridian-context-stewards
    interfaces:
      - id: local
        status: active
        type: mcp
        urls:
          - "http://127.0.0.1:7391/mcp"
        network: loopback
        auth:
          method: none
          env: {}
        access_check:
          url: "http://localhost:7391/healthz"
          expect: A 200 response naming the server build and the indexes it has loaded.
        limitations:
          - The server is started by the practitioner's own harness, so it answers only while that session is open.
          - It indexes the wiki and the published rate schedules; nothing in the issue tracker is searchable through it.
    scope: established
    anchors:
      - intake-runbook
    limitations:
      - The index is rebuilt nightly, so a page written this morning is not yet reachable through it.
  - ref: "meridian-health-agency#public-rates-api"
    id: public-rates-api
    declared: false
    source: meridian-health-agency@1
    name: Meridian Public Rates API
    kind: api
    status: active
    maintainer:
      alias: meridian-rates-publication
    interfaces:
      - id: rest
        status: active
        type: rest
        urls:
          - "https://rates.meridian.invalid/public/v1"
        network: public
        auth:
          method: none
          env: {}
        access_check:
          url: "https://rates.meridian.invalid/public/v1/schedules"
          expect: A 200 response listing the published rate schedules and the period each covers.
        limitations:
          - Only published schedules are served; a schedule in review is absent rather than marked, so an empty answer is not a statement that no rate exists.
          - Anonymous callers are limited to sixty requests a minute per address, and the limit is enforced by rejecting rather than queueing.
    scope: not-established
    anchors: []
    limitations:
      - Nobody on this team has called it, so there is no anchor to point at and no claim that the published schedules answer what intake needs.
  - ref: "harbor-line-consulting#delivery-board"
    id: delivery-board
    declared: false
    source: harbor-line-consulting@1
    name: Harbor Line Delivery Board
    kind: web-app
    status: active
    maintainer:
      alias: harbor-line-platform
    interfaces:
      - id: web
        status: active
        type: web
        urls:
          - "https://board.harbor-line.invalid/"
        network: internal
        auth:
          method: sso
          env: {}
        limitations:
          - A board is scoped to one engagement, so work that spans two engagements appears twice and reconciles nowhere.
      - id: rest
        status: active
        type: rest
        urls:
          - "https://board.harbor-line.invalid/api/v1"
        network: internal
        auth:
          method: api-key
          env:
            HARBOR_LINE_BOARD_TOKEN: A token scoped to the engagements the caller is staffed on.
        access_check:
          url: "https://board.harbor-line.invalid/api/v1/engagements"
          expect: A 200 response listing the engagements the caller is staffed on.
        limitations:
          - Cards carry an engagement code and no client identifier, so a reader outside the engagement cannot tell whose work a card is.
    scope: established
    anchors:
      - intake-engagement-board
    limitations: []
  - ref: "claims-intake-modernization#vendor-pricing-feed"
    id: vendor-pricing-feed
    declared: true
    source: claims-intake-modernization@1
    name: Vendor Pricing Feed
    kind: api
    status: active
    rationale: Neither organization publishes a document that owns it -- it arrived with a vendor agreement and no system record -- and intake pricing rules depend on it weekly. Declaring it here rather than copying an Org entry keeps proposing it upstream somebody's job.
    interfaces: []
    scope: established
    anchors:
      - vendor-pricing-window
    limitations:
      - The feed serves the current pricing window alone; an earlier window is obtainable only by asking the vendor.
unreferenced_systems:
  - ref: "harbor-line-consulting#engineering-handbook"
    name: Harbor Line Engineering Handbook
    kind: web-app
    status: active
    maintainer:
      alias: harbor-line-practice
    source: harbor-line-consulting@1
  - ref: "harbor-line-consulting#sandbox-cluster"
    name: Harbor Line Sandbox Cluster
    kind: service
    status: active
    maintainer:
      alias: harbor-line-platform
    source: harbor-line-consulting@1
  - ref: "meridian-health-agency#artifact-registry"
    name: Meridian Artifact Registry
    kind: service
    status: active
    maintainer:
      alias: meridian-delivery-tools
    source: meridian-health-agency@1
  - ref: "meridian-health-agency#build-pipeline"
    name: Meridian Build Pipeline
    kind: service
    status: active
    maintainer:
      alias: meridian-delivery-tools
    source: meridian-health-agency@1
  - ref: "meridian-health-agency#claims-triage-assistant"
    name: Meridian Claims Triage Assistant
    kind: agent
    status: active
    maintainer:
      alias: meridian-claims-operations
    source: meridian-health-agency@1
  - ref: "meridian-health-agency#code-quality"
    name: Meridian Code Quality Service
    kind: service
    status: deprecated
    maintainer:
      alias: meridian-delivery-tools
    source: meridian-health-agency@1
  - ref: "meridian-health-agency#source-host"
    name: Meridian Source Host
    kind: repository
    status: active
    maintainer:
      alias: meridian-delivery-tools
    source: meridian-health-agency@1
repositories:
  - id: intake-service
    location: "url:https://code.meridian.invalid/meridian-claims-operations/intake-service"
    purpose: The service that accepts and queues claims. The rest of the repository belongs to the operations team.
    coverage: partial
    path_scope:
      - src/intake/
      - tests/intake/
  - id: intake-workflows
    location: "url:https://code.harbor-line.invalid/harbor-line-platform/intake-workflows"
    purpose: The contractor's automation around the same service. This context is the only team that touches it.
    coverage: whole
anchors:
  - id: intake-runbook
    label: The intake runbook, which is where a newcomer starts
    location: "url:https://wiki.meridian.invalid/spaces/intake/runbook"
    note: Reachable from the agency's internal network only.
  - id: intake-board
    label: The tracker filter holding this context's open intake work
    location: "url:https://tracker.meridian.invalid/projects/intake/board"
  - id: intake-engagement-board
    label: The contractor's delivery board for the intake engagement
    location: "url:https://board.harbor-line.invalid/engagements/intake"
  - id: vendor-pricing-window
    label: The pricing window the feed is currently serving
    location: "url:https://pricing.vendor.invalid/windows/current"
    note: The vendor rotates the credential each quarter and announces it by mail rather than through either organization's systems.
outputs:
  roles:
    - analyst
    - engineer
    - product-manager
  guidance: Start from the view. It says which of the two organizations owns each fact and which release that fact came from, so a disagreement becomes a proposal against a named document rather than an argument.
  destination: "file:views/claims-intake-modernization"
limitations:
  - This context covers how claims reach the intake queue and not what happens to them afterwards; adjudication is a different team's boundary.
  - The agency's code-quality service is deprecated and this context does not use it, so nothing here says whether an intake change would pass its gates.
  - The contractor's sandbox holds synthetic records only, so a question that needs real intake volumes cannot be answered there.
access_failures:
  - system: "meridian-health-agency#public-rates-api"
    attempt: Called the published schedules endpoint from an agency workstation during the last release.
    outcome: The anonymous rate limit rejected the calls a workflow would need to make. A service account with its own quota would resolve it; the request sits with the rates publication alias.
  - system: "harbor-line-consulting#sandbox-cluster"
    attempt: Asked the contractor's platform alias for a sandbox this context could keep between weeks.
    outcome: The weekly erase cycle applies to every sandbox and has no exemption, so the request was declined. A longer-lived environment would have to be a new offering rather than an exception.
provenance:
  upstreams:
    - id: harbor-line-consulting
      release_recorded: 1
      release_current: 1
      currency_verified: true
    - id: meridian-health-agency
      release_recorded: 1
      release_current: 1
      currency_verified: true
