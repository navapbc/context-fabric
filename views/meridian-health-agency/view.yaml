systems:
  - id: issue-tracker
    source: meridian-health-agency@3
    name: Meridian Issue Tracker
    purpose: Where the agency files, triages and tracks work, including intake defects.
    kind: web-app
    status: active
    maintainer:
      alias: meridian-delivery-tools
    interfaces:
      - id: rest
        purpose: Read and update work items from scripts and agents.
        status: active
        type: rest
        locators:
          - role: endpoint
            url: "https://tracker.meridian.invalid/api/v2"
        network: internal
        auth:
          method: api-key
          env:
            MERIDIAN_TRACKER_TOKEN: A personal token the tracker issues; it carries the caller's own permissions and no more.
        api:
          schema_url: "https://tracker.meridian.invalid/docs/api-v1"
          spec_format: openapi
      - id: web
        purpose: Browse boards and file work by hand.
        status: active
        type: web
        locators:
          - role: endpoint
            url: "https://tracker.meridian.invalid/"
        network: internal
        auth:
          method: sso
          env: {}
  - id: program-wiki
    source: meridian-health-agency@3
    name: Meridian Program Wiki
    purpose: The agency's program documentation, runbooks and decision records.
    kind: web-app
    status: active
    maintainer:
      alias: meridian-context-stewards
    interfaces:
      - id: rest
        status: active
        type: rest
        locators:
          - role: endpoint
            url: "https://wiki.meridian.invalid/api/v1"
        network: internal
        auth:
          method: api-key
          env:
            MERIDIAN_WIKI_TOKEN: A token scoped to the spaces the caller already reads in the web interface.
      - id: web
        status: active
        type: web
        locators:
          - role: endpoint
            url: "https://wiki.meridian.invalid/"
        network: internal
        auth:
          method: sso
          env: {}
  - id: source-host
    source: meridian-health-agency@3
    name: Meridian Source Host
    purpose: Hosts the agency's code repositories and their reviews.
    kind: repository
    status: active
    maintainer:
      alias: meridian-delivery-tools
    interfaces:
      - id: rest
        status: active
        type: rest
        locators:
          - role: endpoint
            url: "https://code.meridian.invalid/api/v4"
        network: internal
        auth:
          method: host-tool
          env: {}
      - id: git
        status: active
        type: git
        locators:
          - role: unclassified
            url: "https://code.meridian.invalid/"
        network: internal
        auth:
          method: ssh-key
          env:
            MERIDIAN_SOURCE_KEY_ID: Which key the caller presents to the source host; the key itself is never named in a shared document.
  - id: build-pipeline
    source: meridian-health-agency@3
    name: Meridian Build Pipeline
    purpose: Builds, tests and publishes the agency's services on every change.
    kind: service
    status: active
    maintainer:
      alias: meridian-delivery-tools
    interfaces:
      - id: rest
        status: active
        type: rest
        locators:
          - role: endpoint
            url: "https://builds.meridian.invalid/api/v1"
        network: internal
        auth:
          method: api-key
          env:
            MERIDIAN_BUILD_TOKEN: A token that reads pipeline status; it cannot start, cancel, or retry a run.
  - id: code-quality
    source: meridian-health-agency@3
    name: Meridian Code Quality Service
    purpose: Static-analysis gates on pull requests, on its way out.
    kind: service
    status: deprecated
    maintainer:
      alias: meridian-delivery-tools
    interfaces:
      - id: rest
        status: deprecated
        type: rest
        locators:
          - role: endpoint
            url: "https://quality.meridian.invalid/api/v1"
        network: internal
        auth:
          method: api-key
          env:
            MERIDIAN_QUALITY_TOKEN: A read-only token for the quality gate's own reports.
  - id: artifact-registry
    source: meridian-health-agency@3
    name: Meridian Artifact Registry
    purpose: Stores the packages and container images the build pipeline publishes.
    kind: service
    status: active
    maintainer:
      alias: meridian-delivery-tools
    interfaces:
      - id: rest
        status: active
        type: rest
        locators:
          - role: endpoint
            url: "https://artifacts.meridian.invalid/api/v1"
        network: internal
        auth:
          method: api-key
          env:
            MERIDIAN_REGISTRY_TOKEN: A token that reads and publishes packages under the caller's own namespace.
  - id: public-rates-api
    source: meridian-health-agency@3
    name: Meridian Public Rates API
    purpose: Publishes the agency's fee schedules for anyone to read.
    kind: api
    status: active
    maintainer:
      alias: meridian-rates-publication
    interfaces:
      - id: rest
        status: active
        type: rest
        locators:
          - role: endpoint
            url: "https://rates.meridian.invalid/public/v1"
        network: public
        auth:
          method: none
          env: {}
  - id: docs-search
    source: meridian-health-agency@3
    name: Meridian Documentation Search
    purpose: Lets an agent search the agency's documentation without browsing the wiki.
    kind: mcp-server
    status: active
    previous_ids:
      - documentation-search
    maintainer:
      alias: meridian-context-stewards
    interfaces:
      - id: local
        status: active
        type: mcp
        locators:
          - role: endpoint
            url: "https://search.meridian.invalid/mcp"
        network: internal
        auth:
          method: sso
          env: {}
  - id: claims-triage-assistant
    source: meridian-health-agency@3
    name: Meridian Claims Triage Assistant
    purpose: Suggests a queue and a priority for each incoming claim.
    kind: agent
    status: active
    maintainer:
      alias: meridian-claims-operations
    interfaces:
      - id: cli
        status: active
        type: cli
        locators:
          - role: unclassified
            url: "https://code.meridian.invalid/meridian-claims-operations/triage-assistant"
        network: internal
        auth:
          method: oauth
          env:
            MERIDIAN_TRIAGE_CLIENT_ID: Which registered client the assistant authenticates as; the secret behind it is never named in a shared document.
provenance:
  upstreams: []
auth_methods:
  host_tool: A tool already signed in on this machine, such as a forge CLI or a cloud SDK, carries the credential.
