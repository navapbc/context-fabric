id: harbor-line-consulting
kind: org
schema_version: 3
release: 3
organization:
  id: harbor-line-consulting
  name: Harbor Line Consulting
  parent: keystone-partners-group
  maintainer:
    alias: harbor-line-platform
maintainer:
  alias: harbor-line-platform
systems:
  - id: delivery-board
    name: Harbor Line Delivery Board
    kind: web-app
    status: active
    maintainer:
      alias: harbor-line-platform
    purpose: The contractor's board for engagement work and weekly rollups.
    interfaces:
      - id: web
        status: active
        type: web
        network: internal
        auth:
          method: sso
          env: {}
        locators:
          - role: endpoint
            url: https://board.harbor-line.invalid/
      - id: rest
        status: active
        type: rest
        network: internal
        auth:
          method: api-key
          env:
            HARBOR_LINE_BOARD_TOKEN: A token scoped to the engagements the caller is staffed on.
        locators:
          - role: endpoint
            url: https://board.harbor-line.invalid/api/v1
  - id: engineering-handbook
    name: Harbor Line Engineering Handbook
    kind: web-app
    status: active
    maintainer:
      alias: harbor-line-practice
    purpose: The contractor's engineering practices and onboarding guide.
    interfaces:
      - id: web
        status: active
        type: web
        network: public
        auth:
          method: none
          env: {}
        locators:
          - role: endpoint
            url: https://handbook.harbor-line.invalid/
  - id: sandbox-cluster
    name: Harbor Line Sandbox Cluster
    kind: service
    status: active
    maintainer:
      alias: harbor-line-platform
    purpose: Short-lived environments holding synthetic data, erased weekly.
    interfaces:
      - id: rest
        status: active
        type: rest
        network: vpn
        auth:
          method: oauth
          env:
            HARBOR_LINE_SANDBOX_CLIENT_ID: Which registered client the caller authenticates as when reaching the sandbox control plane.
        locators:
          - role: endpoint
            url: https://sandbox.harbor-line.invalid/api/v1
