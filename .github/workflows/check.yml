# Full repository verification. Preserve the required status identity below.
#
# The exit contract, and why exit 3 is not simply green:
#
#   0  pass
#   1  a check failed
#   2  usage or environment error
#   3  every test that ran passed, but a stage was skipped
#
# Exit 3 is the interesting one. A skipped stage means a check did not run, and
# treating that as green is how a gate quietly stops gating. But one skip is
# structural and permanent: the exact real-name list lives in tests/local/, which
# is git-ignored by design, so it can never exist in a CI checkout. Failing on it
# would make this job permanently red; passing on every skip would let a real one
# through. So tests/run.sh names each skipped stage with a code, and this job
# accepts exactly the code CI could never satisfy and fails on any other.
#
# Adding a new skip therefore forces a decision here rather than inheriting a
# pass, which is the point.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Do not rename this job. Branch protection on `main` requires the status by
  # its name, and a rename silently disables the required check.
  probe:
    name: Baseline probe
    runs-on: ubuntu-latest
    # The plan requires every session running these tools to opt out of
    # telemetry and update checks. CI is such a session.
    env:
      OPENSPEC_TELEMETRY: "0"
      OPENSPEC_NO_UPDATE_CHECK: "1"
      OPENWIKI_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          # The baseline test walks the kit history and the v0.1.0 / v0.2.0 tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Install jq, yq and Node at manifest values
        run: |
          mkdir -p "$RUNNER_TEMP/framework-bin"
          pin="$(jq -r '.tools.jq.min' framework.json)"
          curl -fLsS "https://github.com/jqlang/jq/releases/download/jq-${pin}/jq-linux-amd64" -o "$RUNNER_TEMP/framework-bin/jq"
          pin="$(jq -r '.tools.yq.version' framework.json)"
          curl -fLsS "https://github.com/mikefarah/yq/releases/download/v${pin}/yq_linux_amd64" -o "$RUNNER_TEMP/framework-bin/yq"
          chmod +x "$RUNNER_TEMP/framework-bin/jq" "$RUNNER_TEMP/framework-bin/yq"
          pin="$(jq -r '.tools.node.min' framework.json)"
          curl -fLsS "https://nodejs.org/dist/v${pin}/node-v${pin}-linux-x64.tar.xz" -o "$RUNNER_TEMP/node.tar.xz"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/framework-bin" "$RUNNER_TEMP/node-v${pin}-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install gate tools at manifest pins
        # The full tests use rg/fd, and style analysis depends on ShellCheck's
        # version. Do not inherit any of these from the moving runner image.
        run: |
          pin="$(jq -r '.tools.rg.version' framework.json)"
          curl -fLsS "https://github.com/BurntSushi/ripgrep/releases/download/${pin}/ripgrep-${pin}-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/rg.tar.gz"
          tar -xzf "$RUNNER_TEMP/rg.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/ripgrep-${pin}-x86_64-unknown-linux-musl/rg" "$RUNNER_TEMP/framework-bin/rg"
          pin="$(jq -r '.tools.fd.version' framework.json)"
          curl -fLsS "https://github.com/sharkdp/fd/releases/download/v${pin}/fd-v${pin}-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/fd.tar.gz"
          tar -xzf "$RUNNER_TEMP/fd.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/fd-v${pin}-x86_64-unknown-linux-musl/fd" "$RUNNER_TEMP/framework-bin/fd"
          pin="$(jq -r '.tools.shellcheck.version' framework.json)"
          curl -fLsS "https://github.com/koalaman/shellcheck/releases/download/v${pin}/shellcheck-v${pin}.linux.x86_64.tar.xz" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-v${pin}/shellcheck" "$RUNNER_TEMP/framework-bin/shellcheck"
          chmod +x "$RUNNER_TEMP/framework-bin/rg" "$RUNNER_TEMP/framework-bin/fd" "$RUNNER_TEMP/framework-bin/shellcheck"

      - name: Runner tool inventory
        run: |
          for t in yq jq node rg fd shellcheck; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%-12s %s\n' "$t" "$("$t" --version 2>&1 | head -3 | tr '\n' ' ')"
            else
              printf '%-12s absent\n' "$t"
            fi
          done

      - name: Install uv at the framework.json pin
        # The optional JSON Schema stage is only optional on a contributor's
        # machine. CI can install the tool, so it does -- the alternative is
        # adding SCHEMA_NOT_VALIDATED to ALLOWED_SKIPS, which would mean the
        # contracts this repository exists to define are never machine-checked
        # anywhere. Allowlist a skip only when CI genuinely cannot satisfy it.
        run: |
          pin="$(jq -r '.tools.uv.version' framework.json)"
          curl -fLsS "https://github.com/astral-sh/uv/releases/download/${pin}/uv-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/uv.tar.gz"
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Warm the check-jsonschema cache
        # Installing uv is not enough. The validator runs the schema stage with
        # `uv run --offline` on purpose -- no script in this repository reaches
        # the network mid-run -- so a cold cache means the stage cannot resolve
        # its package and reports SCHEMA_NOT_VALIDATED. That code is not in
        # ALLOWED_SKIPS and must not be: it would mean the contracts this
        # repository exists to define are never machine-checked anywhere. So the
        # one online fetch happens here, once, before the gate runs, which is the
        # same warm-up `setup-individual` performs on a contributor's machine.
        run: |
          pin="$(jq -r '.tools["check-jsonschema"].version' framework.json)"
          uv run --no-project --with "check-jsonschema==${pin}" \
            check-jsonschema --version

      - name: Install openspec and openwiki at the framework.json pins
        # Same reasoning as uv above: CI can install this, so it does. The
        # alternative was allowlisting OPENSPEC_NOT_VALIDATED, which would mean
        # the spec validation this repository made load-bearing never runs
        # anywhere it is enforced.
        run: |
          for tool in openspec openwiki; do
            pin="$(jq -r --arg tool "$tool" '.tools[$tool].version' framework.json)"
            pkg="$(jq -r --arg tool "$tool" '.tools[$tool].package' framework.json)"
            npm install -g "${pkg}@${pin}"
          done

      - name: Install the official skills reference at its immutable pin
        run: |
          source="$(jq -r '.tools["skills-ref"].install' framework.json)"
          package="$(jq -r '.tools["skills-ref"].package' framework.json)"
          uv tool install --from "$source" "$package"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Gate
        run: |
          trap 'printf "gate elapsed: %ss\n" "$SECONDS"' EXIT
          # The skip codes CI can never satisfy, one per line. Everything else
          # that skips is a check that did not run, and fails the job.
          ALLOWED_SKIPS='REAL_NAMES_NOT_VALIDATED'

          set +e
          out="$(bash tests/run.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"

          # The skip codes are read for EVERY exit, not only exit 3. A run that
          # says it skipped something while exiting 0 contradicts itself, and a
          # gate that only looks at the codes when the exit code tells it to is
          # trusting the one signal the codes exist to cross-check.
          codes="$(printf '%s\n' "$out" | sed -n 's/^SKIPPED_CODES: //p' | tr ' ' '\n' | sed '/^$/d' | sort -u)"

          case "$rc" in
            0)
              if [ -n "$codes" ]; then
                echo "::error title=Gate failed::tests/run.sh exited 0 but named skipped stage(s): $(printf '%s' "$codes" | tr '\n' ' '); a run cannot both pass and skip"
                exit 1
              fi
              echo "gate: pass"
              ;;
            3)
              if [ -z "$codes" ]; then
                echo "::error title=Gate failed::tests/run.sh exited 3 but named no skipped stage; the run cannot be classified"
                exit 1
              fi
              unexpected="$(printf '%s\n' "$codes" | grep -vxF "$ALLOWED_SKIPS" || true)"
              if [ -n "$unexpected" ]; then
                echo "::error title=A check did not run::skipped stage(s) CI is expected to be able to run: $(printf '%s' "$unexpected" | tr '\n' ' ')"
                exit 1
              fi
              echo "gate: pass, skipping only: $(printf '%s' "$codes" | tr '\n' ' ') (not satisfiable in a CI checkout)"
              echo "::warning title=Not validated::REAL_NAMES_NOT_VALIDATED: the private exact-name list is absent in CI"
              ;;
            *)
              echo "::error title=Gate failed::tests/run.sh exited $rc"
              exit "$rc"
              ;;
          esac

      - name: Reader browser checks
        run: |
          pin="$(jq -r '.tools.playwright.version' framework.json)"
          npm install --prefix "$RUNNER_TEMP/reader-test" "playwright@${pin}"
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/reader-test/node_modules/playwright"
          "$PLAYWRIGHT_PATH/cli.js" install --with-deps chromium
          PLAYWRIGHT_CHANNEL=chromium node reader/reader.test.cjs

      - name: Reject generated changes including new and removed paths
        run: |
          scripts/generate.sh
          scripts/render-templates.sh
          git add -A -- views/ templates/
          git diff --cached --exit-code -- views/ templates/

      - name: Build and verify no-clone artifact
        run: |
          mkdir -p "$RUNNER_TEMP/distribution" "$RUNNER_TEMP/bundle-proof"
          scripts/build-bundle.sh --output "$RUNNER_TEMP/distribution/context-fabric.tar.gz"
          scripts/build-bundle.sh --check "$RUNNER_TEMP/distribution/context-fabric.tar.gz"
          cp "$RUNNER_TEMP/distribution/context-fabric.tar.gz" "$RUNNER_TEMP/bundle-proof/bundle.tar.gz"
          cp tests/bundle-container/Dockerfile tests/bundle-container/bundle-entrypoint.sh tests/lib/bundle-smoke.sh "$RUNNER_TEMP/bundle-proof/"

      - name: Prove bundle without Git, clone or network
        run: |
          docker build --tag context-fabric-bundle-proof "$RUNNER_TEMP/bundle-proof"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /workspace:rw,exec,nosuid,size=512m context-fabric-bundle-proof

      - name: Attach the verified distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-fabric-no-clone
          path: ${{ runner.temp }}/distribution/context-fabric.tar.gz
          if-no-files-found: error
