# LOCAL_PATH_FORBIDDEN -- a drive-lettered path after a fat arrow, the way a
# mapping in a configuration file is written.
#
# The `=` of the arrow was already a separator; the `>` that actually precedes
# the drive letter was not. The value is single-quoted because YAML reads a
# backslash escape inside double quotes.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - 'The loader maps export=>D:\claims\extract.csv on the Windows host.'
