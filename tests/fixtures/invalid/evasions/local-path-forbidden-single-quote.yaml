id: example-agency
kind: org
schema_version: 2
release: 1
organization:
  id: example-agency
  name: |-
    Example Agency
    Operators pass '~/exports/claims-extract.csv' to the loader by hand.
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        auth:
          method: oauth
          env: {}
        locators:
          - role: unclassified
            url: https://api.example.invalid/claims/v1
