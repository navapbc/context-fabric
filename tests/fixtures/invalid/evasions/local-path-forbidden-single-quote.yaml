# LOCAL_PATH_FORBIDDEN -- a home-relative path in single quotes, the way a shell
# command line quotes an argument.
#
# The quote is the only character in front of the tilde, and it was not one of
# the separators the anchored entries used to accept. The value is double-quoted
# YAML so that the single quotes are part of the string.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "Operators pass '~/exports/claims-extract.csv' to the loader by hand."
