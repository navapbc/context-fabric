# LOCAL_PATH_FORBIDDEN -- a machine path joined to a relative one by a colon, as
# in a search-path list.
#
# The first entry of the list is relative and passes on its own. The second is
# an absolute root, and the colon in front of it was not one of the separators
# the anchored entries used to accept, so the whole list passed.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "The loader expects vendor/bin:/opt/example-loader/bin on its search path."
