# SECRET_REFERENCE_WHITESPACE -- the reference satisfies the op:// grammar and
# still will not resolve, because a segment carries whitespace the eye does not
# see. A warning rather than an error on purpose: a working trial reference
# carried one, so rejecting the document would reject a document that works.
id: example-practitioner
kind: individual
schema_version: 1
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:documents/bounded-context/example-claims-context.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
    secrets:
      store: op
      env:
        EXAMPLE_CLAIMS_TOKEN: "op://Example-Vault/example claims /credential"
