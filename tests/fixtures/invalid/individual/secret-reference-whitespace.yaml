# SECRET_REFERENCE_WHITESPACE -- the reference satisfies the provider grammar
# and still may not resolve because one segment carries edge whitespace.
id: example-practitioner
kind: individual
schema_version: 2
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:documents/bounded-context/example-claims-context.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
    secrets:
      sources:
        primary:
          provider: 1password
          provider_contract: 1
          configuration:
            store: op
      env:
        EXAMPLE_CLAIMS_TOKEN:
          source: primary
          locator:
            reference: "op://Example-Vault/example claims /credential"
