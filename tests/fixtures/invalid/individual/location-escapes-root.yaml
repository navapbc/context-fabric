# LOCATION_ESCAPES_ROOT -- the location climbs out of the tree that owns the
# referring document. A sibling checkout is a fact about one machine's disk, and
# `url:` plus a local override is the sanctioned way to say it.
id: example-practitioner
kind: individual
schema_version: 2
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:../other-repo/documents/bounded-context/example-claims-context.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
