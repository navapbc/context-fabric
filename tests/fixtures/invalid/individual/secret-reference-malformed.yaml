# SECRET_REFERENCE_MALFORMED -- provider-specific locator validation belongs to
# the declarative provider registry rather than the provider-neutral schema.
id: example-practitioner
kind: individual
schema_version: 3
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:documents/bounded-context/example-claims-context.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
    secrets:
      sources:
        primary:
          provider: 1password
          provider_contract: 1
          configuration:
            store: op
            account: example-account
      env:
        EXAMPLE_CLAIMS_TOKEN:
          source: primary
          locator:
            reference: hunter2
