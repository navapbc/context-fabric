# SECRET_VALUE_FORBIDDEN -- a credential shape outside `secrets.env`, in the
# field that names the account. The scope-`all` denylist runs over every string
# in every tier precisely so the answer does not depend on which field somebody
# pasted into. The token is a prefix and 36 zeros.
id: example-practitioner
kind: individual
schema_version: 2
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:documents/bounded-context/example-claims-context.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
    secrets:
      sources:
        primary:
          provider: 1password
          provider_contract: 1
          configuration:
            store: op
            account: ghp_000000000000000000000000000000000000
      env:
        EXAMPLE_CLAIMS_TOKEN:
          source: primary
          locator:
            reference: op://Example-Vault/example-claims/credential
