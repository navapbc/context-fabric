# LOCATION_ESCAPES_ROOT -- the climb happens mid-path rather than at the front.
# Same rule, and the reason it is a separate fixture is that a reader checking
# only the first segment would let this one through.
id: example-practitioner
kind: individual
schema_version: 2
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:documents/../../escape.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
