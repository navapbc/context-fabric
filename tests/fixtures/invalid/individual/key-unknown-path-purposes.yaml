# KEY_UNKNOWN -- a path purpose for a slot the binding does not have. The notes
# are keyed by the five path slots and nothing else, so a misspelled slot is
# reported rather than silently ignored.
id: example-practitioner
kind: individual
schema_version: 3
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:documents/bounded-context/example-claims-context.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    path_purposes:
      scratch_root: Where throwaway exports land before they are deleted.
    harness:
      id: example-harness
