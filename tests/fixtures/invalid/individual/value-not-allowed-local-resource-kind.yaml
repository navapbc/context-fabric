# VALUE_NOT_ALLOWED -- a local resource kind outside the closed list. A
# database is not a kind this contract describes; directory and cli are.
id: example-practitioner
kind: individual
schema_version: 3
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:documents/bounded-context/example-claims-context.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
    local_resources:
      - id: intake-database
        kind: database
        path: /Users/name/data/intake.db
        purpose: A local copy of intake records for offline analysis.
