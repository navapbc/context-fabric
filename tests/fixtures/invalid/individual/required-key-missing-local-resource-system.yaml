# REQUIRED_KEY_MISSING -- a local resource naming an interface but no system.
# An interface id is only meaningful within the system that carries it.
id: example-practitioner
kind: individual
schema_version: 3
bindings:
  - ref:
      id: example-agency
      release: 1
      location: file:documents/org/example-agency.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
    local_resources:
      - id: tracker-cli
        kind: cli
        path: /usr/local/bin/example-tracker
        purpose: Command-line client for the issue tracker.
        interface: rest
