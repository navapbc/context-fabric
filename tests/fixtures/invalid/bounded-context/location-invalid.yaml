# LOCATION_INVALID -- a location that is neither `url:https://...` nor a
# repository-relative `file:` path. An absolute path behind the `file:` prefix
# is still an absolute path.
#
# The path sits under a root no local-path denylist entry names, so this fixture
# witnesses LOCATION_INVALID alone. Under a root the denylist does name, such as
# /opt, the colon of the prefix is a boundary and the same location is also
# LOCAL_PATH_FORBIDDEN.
id: example-claims-context
kind: bounded-context
schema_version: 1
release: 1
identity:
  name: Example Claims Context
  purpose: What one analysis team needs in order to answer questions about claims intake.
organizations:
  - example-agency
extends:
  - id: example-agency
    release: 1
    location: file:/shared/documents/org/example-agency.yaml
systems:
  - ref: example-agency#claims-warehouse
    scope: not-established
outputs:
  roles:
    - analyst
  guidance: Read the view first.
  destination: file:views/example-claims-context
limitations: []
access_failures: []
