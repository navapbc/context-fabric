# The smallest Bounded Context the contract accepts. It names one organization,
# extends one Org document, and references one system from it rather than
# copying the system's facts.
id: example-claims-context
kind: bounded-context
schema_version: 1
release: 1
identity:
  name: Example Claims Context
  purpose: What one analysis team needs in order to answer questions about claims intake.
organizations:
  - example-agency
extends:
  - id: example-agency
    release: 1
    location: file:documents/org/example-agency.yaml
systems:
  - ref: example-agency#claims-warehouse
    scope: established
    anchors:
      - claims-intake-counts
anchors:
  - id: claims-intake-counts
    label: The saved query that returns yesterday's intake counts
    location: url:https://reports.example.invalid/saved/claims-intake
outputs:
  roles:
    - analyst
  guidance: Read the view before asking the team; it carries what the documents already agree on.
  destination: file:views/example-claims-context
limitations:
  - 'Checked on 2026-04-17: the extract still drops a day late.'
  - Verified by the audit team; the row counts did not reconcile.
access_failures: []
