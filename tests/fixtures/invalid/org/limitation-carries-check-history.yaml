# LIMITATION_CARRIES_CHECK_HISTORY -- the contract accepts this document and the
# validator does not. A limitation says what an interface will not do; the date
# somebody last looked is a fact about the looking, not about the interface, and
# R11 keeps that log out of the governed document. The schema cannot see the
# difference between this sentence and a good one, which is why the fixture is
# named for a validator rule rather than a contract rule.
id: example-audit-office
kind: org
schema_version: 1
release: 1
organization:
  id: example-audit-office
  name: Example Audit Office
systems:
  - id: audit-extract
    name: Audit Extract
    kind: service
    status: active
    interfaces:
      - id: nightly
        status: active
        type: sftp
        urls:
          - https://files.example.invalid/audit-extract
        auth:
          method: ssh-key
          env:
            EXAMPLE_AUDIT_KEY_ID: Which key the extract host expects.
        limitations:
          - "Checked on 2026-04-17: the extract still drops a day late."
          - "Verified by the audit team; the row counts did not reconcile."
