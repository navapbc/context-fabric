# VALUE_NOT_ALLOWED -- a value outside the fixed list the contract gives: an
# auth method that is a near-miss of a real one. Like a misspelled key, this used
# to exit 2 as a fault in the checkout rather than 1 as a fault in the document.
# The smallest Org document the contract accepts: one organization, one system,
# one interface. Every fictional name here ends in .invalid or starts with
# "example" on purpose -- this repository is public and ships no real fact.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oath
          env:
            EXAMPLE_CLAIMS_TOKEN: "What the read API expects; where the value lives is an Individual document's business, never this one's."
        limitations: []
