id: example-agency
kind: org
schema_version: 3
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        auth:
          method: oauth
          env:
            EXAMPLE_CLAIMS_TOKEN: Read it from op://Example-Vault/example-claims/credential before the call.
        locators:
          - role: unclassified
            url: https://api.example.invalid/claims/v1
