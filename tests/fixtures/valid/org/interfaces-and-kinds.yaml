id: example-platform
kind: org
schema_version: 3
release: 4
organization:
  id: example-platform
  name: |-
    Example Platform Office
    The server is started by the practitioner's harness, so it answers only while that session is open.
    The assistant reports what it changed, not what it read, so a review cannot reconstruct its inputs.
    Retired in release 3. The rows it produced are still referenced by older views.
  parent: example-agency
  maintainer:
    alias: example-platform-team
maintainer:
  alias: example-platform-team
secret_storage:
  - id: team-vault
    name: The team's shared password manager vault
    guidance: Ask the platform team for access; this document never records a reference, only that the store exists.
systems:
  - id: context-server
    name: Example Context Server
    purpose: Serves the platform's shared context to agents in signed-in sessions so a task can read approved facts without each team copying them into its own prompt files.
    kind: mcp-server
    status: active
    previous_ids:
      - example-context-server
    maintainer:
      alias: example-platform-team
    interfaces:
      - id: hosted
        status: deprecated
        previous_ids:
          - hosted-preview
        type: mcp
        network: internal
        auth:
          method: sso
          env:
            EXAMPLE_PLATFORM_SESSION: The session the hosted endpoint expects.
        locators:
          - role: unclassified
            url: https://context.example.invalid/mcp
      - id: admin-api
        purpose: Lets the platform team change server settings from their signed-in CLI profile.
        status: active
        type: rest
        network: internal
        auth:
          method: host-tool
          env:
            EXAMPLE_PLATFORM_PROFILE: Which of the platform CLI's signed-in profiles to call as; the credential stays with the CLI.
        locators:
          - role: unclassified
            url: https://context.example.invalid/admin/v1
        api:
          schema_url: https://context.example.invalid/admin/v1/openapi.json
          spec_format: openapi
      - id: query-api
        purpose: Answers read-only questions about the context catalog.
        status: active
        type: graphql
        network: internal
        auth:
          method: sso
          env: {}
        locators:
          - role: endpoint
            url: https://context.example.invalid/graphql
        api:
          schema_url: https://context.example.invalid/graphql/schema.graphql
          spec_format: graphql-sdl
  - id: release-assistant
    name: Example Release Assistant
    kind: agent
    status: active
    interfaces:
      - id: cli
        status: active
        type: cli
        auth:
          method: ssh-key
          env:
            EXAMPLE_RELEASE_KEY_ID: Which key the assistant presents; the key itself is never named here.
        locators:
          - role: unclassified
            url: https://code.example.invalid/example-platform/release-assistant
  - id: retired-extract
    name: Retired Nightly Extract
    kind: service
    status: retired
    interfaces:
      - id: sftp-drop
        status: retired
        type: sftp
        auth:
          method: none
          env: {}
        locators:
          - role: unclassified
            url: https://files.example.invalid/retired-extract
