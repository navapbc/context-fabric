view_contract: 2
kind: org
id: example-platform
release: 4
organization:
  id: example-platform
  name: Example Platform Office
  parent: example-agency
  maintainer:
    alias: example-platform-team
maintainer:
  alias: example-platform-team
secret_storage:
  - id: team-vault
    name: The team's shared password manager vault
    guidance: Ask the platform team for access; this document never records a reference, only that the store exists.
systems:
  - id: context-server
    source: example-platform@4
    name: Example Context Server
    kind: mcp-server
    status: active
    previous_ids:
      - example-context-server
    maintainer:
      alias: example-platform-team
    interfaces:
      - id: local-stdio
        status: active
        type: mcp
        network: internal
        auth:
          method: none
          env: {}
        locators:
          - role: unclassified
            url: https://connector.example.invalid/mcp
      - id: hosted
        status: deprecated
        previous_ids:
          - hosted-preview
        type: mcp
        network: internal
        auth:
          method: sso
          env:
            EXAMPLE_PLATFORM_SESSION: The session the hosted endpoint expects.
        locators:
          - role: unclassified
            url: https://context.example.invalid/mcp
      - id: admin-api
        status: active
        type: rest
        network: internal
        auth:
          method: host-tool
          env:
            EXAMPLE_PLATFORM_PROFILE: Which of the platform CLI's signed-in profiles to call as; the credential stays with the CLI.
        locators:
          - role: unclassified
            url: https://context.example.invalid/admin/v1
  - id: release-assistant
    source: example-platform@4
    name: Example Release Assistant
    kind: agent
    status: active
    interfaces:
      - id: cli
        status: active
        type: cli
        auth:
          method: ssh-key
          env:
            EXAMPLE_RELEASE_KEY_ID: Which key the assistant presents; the key itself is never named here.
        locators:
          - role: unclassified
            url: https://code.example.invalid/example-platform/release-assistant
  - id: retired-extract
    source: example-platform@4
    name: Retired Nightly Extract
    kind: service
    status: retired
    interfaces:
      - id: sftp-drop
        status: retired
        type: sftp
        auth:
          method: none
          env: {}
        locators:
          - role: unclassified
            url: https://files.example.invalid/retired-extract
provenance:
  upstreams: []
auth_methods:
  host_tool: A tool already signed in on the machine carries the credential; use the existing tool session rather than resolving a new credential.
index:
  - id: context-server
    name: Example Context Server
    kind: mcp-server
    status: active
    interfaces:
      - id: local-stdio
        type: mcp
      - id: hosted
        type: mcp
      - id: admin-api
        type: rest
  - id: release-assistant
    name: Example Release Assistant
    kind: agent
    status: active
    interfaces:
      - id: cli
        type: cli
  - id: retired-extract
    name: Retired Nightly Extract
    kind: service
    status: retired
    interfaces:
      - id: sftp-drop
        type: sftp
