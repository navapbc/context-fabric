view_contract: 1
kind: org
id: example-platform
release: 4
organization:
  id: example-platform
  name: Example Platform Office
  parent: example-agency
  maintainer:
    alias: example-platform-team
maintainer:
  alias: example-platform-team
secret_storage:
  - id: team-vault
    name: The team's shared password manager vault
    guidance: Ask the platform team for access; this document never records a reference, only that the store exists.
systems:
  - id: context-server
    source: example-platform@4
    name: Example Context Server
    kind: mcp-server
    status: active
    previous_ids:
      - example-context-server
    maintainer:
      alias: example-platform-team
    interfaces:
      - id: local-stdio
        status: active
        type: mcp
        urls:
          - https://connector.example.invalid/mcp
        network: internal
        auth:
          method: none
          env: {}
        access_check:
          url: https://connector.example.invalid/health
          expect: A 200 response naming the server build.
        limitations:
          - The server is started by the practitioner's harness, so it answers only while that session is open.
      - id: hosted
        status: deprecated
        previous_ids:
          - hosted-preview
        type: mcp
        urls:
          - https://context.example.invalid/mcp
        network: internal
        auth:
          method: sso
          env:
            EXAMPLE_PLATFORM_SESSION: The session the hosted endpoint expects.
        limitations: []
      - id: admin-api
        status: active
        type: rest
        urls:
          - https://context.example.invalid/admin/v1
        network: internal
        auth:
          method: host-tool
          explanation: A tool already signed in on this machine, such as a forge CLI or a cloud SDK, carries the credential.
          env:
            EXAMPLE_PLATFORM_PROFILE: Which of the platform CLI's signed-in profiles to call as; the credential stays with the CLI.
        limitations: []
  - id: release-assistant
    source: example-platform@4
    name: Example Release Assistant
    kind: agent
    status: active
    interfaces:
      - id: cli
        status: active
        type: cli
        urls:
          - https://code.example.invalid/example-platform/release-assistant
        auth:
          method: ssh-key
          env:
            EXAMPLE_RELEASE_KEY_ID: Which key the assistant presents; the key itself is never named here.
        limitations:
          - The assistant reports what it changed, not what it read, so a review cannot reconstruct its inputs.
  - id: retired-extract
    source: example-platform@4
    name: Retired Nightly Extract
    kind: service
    status: retired
    interfaces:
      - id: sftp-drop
        status: retired
        type: sftp
        urls:
          - https://files.example.invalid/retired-extract
        auth:
          method: none
          env: {}
        limitations:
          - Retired in release 3. The rows it produced are still referenced by older views.
provenance:
  upstreams: []
