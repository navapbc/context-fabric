systems:
  - id: context-server
    source: example-platform@4
    name: Example Context Server
    purpose: Serves the platform's shared context to agents in signed-in sessions so a task can read approved facts without each team copying them into its own prompt files.
    kind: mcp-server
    status: active
    previous_ids:
      - example-context-server
    maintainer:
      alias: example-platform-team
    interfaces:
      - id: admin-api
        purpose: Lets the platform team change server settings from their signed-in CLI profile.
        status: active
        type: rest
        locators:
          - role: unclassified
            url: "https://context.example.invalid/admin/v1"
        network: internal
        auth:
          method: host-tool
          env:
            EXAMPLE_PLATFORM_PROFILE: Which of the platform CLI's signed-in profiles to call as; the credential stays with the CLI.
        api:
          schema_url: "https://context.example.invalid/admin/v1/openapi.json"
          spec_format: openapi
      - id: query-api
        purpose: Answers read-only questions about the context catalog.
        status: active
        type: graphql
        locators:
          - role: endpoint
            url: "https://context.example.invalid/graphql"
        network: internal
        auth:
          method: sso
          env: {}
        api:
          schema_url: "https://context.example.invalid/graphql/schema.graphql"
          spec_format: graphql-sdl
      - id: hosted
        status: deprecated
        previous_ids:
          - hosted-preview
        type: mcp
        locators:
          - role: unclassified
            url: "https://context.example.invalid/mcp"
        network: internal
        auth:
          method: sso
          env:
            EXAMPLE_PLATFORM_SESSION: The session the hosted endpoint expects.
  - id: release-assistant
    source: example-platform@4
    name: Example Release Assistant
    purpose: Drafts release notes and tags for platform repositories.
    kind: agent
    status: active
    interfaces:
      - id: cli
        status: active
        type: cli
        locators:
          - role: unclassified
            url: "https://code.example.invalid/example-platform/release-assistant"
        auth:
          method: ssh-key
          env:
            EXAMPLE_RELEASE_KEY_ID: Which key the assistant presents; the key itself is never named here.
  - id: retired-extract
    source: example-platform@4
    name: Retired Nightly Extract
    kind: service
    status: retired
    interfaces:
      - id: sftp-drop
        status: retired
        type: sftp
        locators:
          - role: unclassified
            url: "https://files.example.invalid/retired-extract"
        auth:
          method: none
          env: {}
provenance:
  upstreams: []
auth_methods:
  host_tool: A tool already signed in on this machine, such as a forge CLI or a cloud SDK, carries the credential.
